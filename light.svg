<svg width="850" height="450" viewBox="0 0 850 450" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <linearGradient id="iconStrokeL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <radialGradient id="logoGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#eef2ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="avatarClipLight">
      <circle cx="0" cy="0" r="26"/>
    </clipPath>

    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.18"/>
    </filter>

    <filter id="dropShadowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer frame -->
  <rect x="0" y="0" width="850" height="450" rx="18" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="847" height="447" rx="17" fill="none" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- ================= LEFT PANEL ================= -->
  <g>
    <rect x="18" y="18" width="292" height="414" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>

    <!-- glow backdrop -->
    <circle cx="164" cy="225" r="180" fill="url(#logoGlowL)">
      <animate attributeName="r" values="170;190;170" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- drifting matrix-like lines -->
    <g stroke="#93a3c9" stroke-width="1" opacity="0.4">
      <line x1="40" y1="60" x2="40" y2="140">
        <animate attributeName="y1" values="60;380;60" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="140;460;140" dur="9s" repeatCount="indefinite"/>
      </line>
      <line x1="90" y1="30" x2="90" y2="90">
        <animate attributeName="y1" values="30;400;30" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="90;460;90" dur="12s" repeatCount="indefinite"/>
      </line>
      <line x1="250" y1="80" x2="250" y2="150">
        <animate attributeName="y1" values="80;420;80" dur="10.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="150;480;150" dur="10.5s" repeatCount="indefinite"/>
      </line>
      <line x1="280" y1="20" x2="280" y2="70">
        <animate attributeName="y1" values="20;390;20" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="70;450;70" dur="8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- floating abstract geometric shapes -->
    <g opacity="0.55">
      <rect x="55" y="330" width="18" height="18" fill="none" stroke="#4338ca" stroke-width="1.2" transform="rotate(20 64 339)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 6,-14; 0,0" dur="7s" repeatCount="indefinite" additive="sum"/>
        <animateTransform attributeName="transform" type="rotate" values="20 64 339;80 64 339;20 64 339" dur="14s" repeatCount="indefinite" additive="sum"/>
      </rect>
      <circle cx="255" cy="330" r="9" fill="none" stroke="#334155" stroke-width="1.2">
        <animateTransform attributeName="transform" type="translate" values="0,0; -8,12; 0,0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <polygon points="0,-10 9,7 -9,7" fill="none" stroke="#4338ca" stroke-width="1.1" transform="translate(230,90)">
        <animateTransform attributeName="transform" type="translate" values="230,90; 224,104; 230,90" dur="8s" repeatCount="indefinite"/>
      </polygon>
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#334155" stroke-width="1" transform="translate(48,110) rotate(45)">
        <animateTransform attributeName="transform" type="translate" values="48,110; 56,96; 48,110" dur="10s" repeatCount="indefinite" additive="sum"/>
      </rect>
    </g>

    <!-- Large profile photo hero -->
    <clipPath id="heroClipLight">
      <circle cx="0" cy="0" r="88"/>
    </clipPath>

    <g transform="translate(164,205)">
      <!-- outer soft ring -->
      <circle r="104" fill="none" stroke="#4338ca" stroke-width="1.5" opacity="0.35">
        <animate attributeName="r" values="100;110;100" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
      </circle>
      <!-- rotating dashed tech ring -->
      <circle r="97" fill="none" stroke="url(#iconStrokeL)" stroke-width="1.4" stroke-dasharray="6 10" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
      </circle>
      <!-- solid border with drop shadow -->
      <circle r="90" fill="#ffffff" stroke="url(#iconStrokeL)" stroke-width="3" filter="url(#dropShadow)"/>
      <!-- photo -->
      <image href="https://github.com/Euuiiii.png" x="-88" y="-88" width="176" height="176" clip-path="url(#heroClipLight)"/>
      <!-- small orbiting node -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/>
        <circle cx="97" cy="0" r="5" fill="#4338ca">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <text x="164" y="330" text-anchor="middle" fill="#57606a" font-family="monospace, Courier New" font-size="12" letter-spacing="2">FULL-STACK ENGINE</text>
    <text x="164" y="352" text-anchor="middle" fill="#312e81" font-family="monospace, Courier New" font-size="15" font-weight="bold" letter-spacing="1">
      &lt; EMON.DEV /&gt;
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="164" y="374" text-anchor="middle" fill="#15803d" font-family="monospace, Courier New" font-size="11">● online &amp; shipping code</text>
  </g>

  <!-- ================= RIGHT PANEL (TERMINAL) ================= -->
  <g>
    <rect x="326" y="18" width="506" height="414" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" filter="url(#dropShadowSoft)"/>

    <!-- title bar -->
    <rect x="326" y="18" width="506" height="34" rx="14" fill="#eaeef2" stroke="#d0d7de" stroke-width="1"/>
    <rect x="326" y="40" width="506" height="12" fill="#eaeef2"/>
    <circle cx="348" cy="35" r="5.5" fill="#ff5f56"/>
    <circle cx="366" cy="35" r="5.5" fill="#ffbd2e"/>
    <circle cx="384" cy="35" r="5.5" fill="#27c93f"/>
    <text x="580" y="39" text-anchor="middle" fill="#57606a" font-family="monospace, Courier New" font-size="12">emon@dev-machine: ~/portfolio</text>

    <!-- Profile row -->
    <g transform="translate(360,90)">
      <clipPath id="avatarClipLight2">
        <circle cx="0" cy="0" r="26"/>
      </clipPath>
      <circle cx="0" cy="0" r="28" fill="none" stroke="url(#iconStrokeL)" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      </circle>
      <image href="https://github.com/Euuiiii.png" x="-26" y="-26" width="52" height="52" clip-path="url(#avatarClipLight2)"/>
    </g>

    <text x="404" y="82" fill="#4338ca" font-family="monospace, Courier New" font-size="13">$ whoami</text>
    <text x="404" y="102" fill="#1e293b" font-family="monospace, Courier New" font-size="18" font-weight="bold">Emon Adhikari</text>

    <line x1="360" y1="135" x2="798" y2="135" stroke="#d0d7de" stroke-width="1"/>

    <!-- Skills -->
    <text x="360" y="163" fill="#4338ca" font-family="monospace, Courier New" font-size="13">$ cat skills.json</text>

    <g font-family="monospace, Courier New" font-size="12.5" font-weight="bold">
      <rect x="360" y="178" width="52" height="26" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1"/>
      <text x="386" y="195" text-anchor="middle" fill="#3730a3">JS</text>

      <rect x="420" y="178" width="66" height="26" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
      <text x="453" y="195" text-anchor="middle" fill="#9a3412">HTML</text>

      <rect x="494" y="178" width="62" height="26" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1"/>
      <text x="525" y="195" text-anchor="middle" fill="#155e75">CSS</text>

      <rect x="564" y="178" width="80" height="26" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
      <text x="604" y="195" text-anchor="middle" fill="#166534">Python</text>

      <rect x="360" y="214" width="86" height="26" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1"/>
      <text x="403" y="231" text-anchor="middle" fill="#166534">Django</text>

      <rect x="454" y="214" width="72" height="26" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1"/>
      <text x="490" y="231" text-anchor="middle" fill="#5b21b6">React</text>
    </g>

    <line x1="360" y1="270" x2="798" y2="270" stroke="#d0d7de" stroke-width="1"/>

    <!-- Status -->
    <text x="360" y="298" fill="#4338ca" font-family="monospace, Courier New" font-size="13">$ status --watch</text>

    <g font-family="monospace, Courier New" font-size="12.5">
      <circle cx="368" cy="322" r="4" fill="#15803d">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="380" y="326" fill="#334155">Debugging React Components</text>

      <circle cx="368" cy="346" r="4" fill="#c2410c">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="380" y="350" fill="#334155">Reconciling Assets</text>

      <circle cx="368" cy="370" r="4" fill="#0e7490">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="380" y="374" fill="#334155">Optimizing Web UX</text>
    </g>

    <!-- prompt with blinking cursor -->
    <text x="360" y="408" fill="#15803d" font-family="monospace, Courier New" font-size="13">emon@dev ~ % <tspan fill="#57606a">building the future...</tspan></text>
    <rect x="595" y="397" width="8" height="14" fill="#4338ca">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
